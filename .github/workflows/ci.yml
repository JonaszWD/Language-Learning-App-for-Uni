name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The tests only touch the non-GUI layers, so install just what they need.
      - run: pip install pytest bcrypt sqlalchemy python-dotenv deepl
      - run: python -m pytest -q
